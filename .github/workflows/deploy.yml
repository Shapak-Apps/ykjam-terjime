name: Deploy to GitHub Pages

# Сайт собирается здесь, а не лежит в репозитории готовыми файлами:
# в ветке — только исходники, в Pages уезжает результат next build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Выкладки не должны обгонять друг друга, но и обрывать начатую не надо.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # enablement переключает Pages с джекилловской сборки на Actions прямо
      # во время первого запуска: до этого момента старый сайт продолжает
      # отдаваться, поэтому privacy-policy.html не пропадает.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      # basePath задан в next.config.ts, экспорт кладётся в out/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
